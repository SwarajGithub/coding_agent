version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL_NAME=qwen3-8k:latest
      - LLM_API_KEY=ollama
    volumes:
      - ./backend/sandbox/workspace:/app/sandbox/workspace
    networks:
      - agent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
